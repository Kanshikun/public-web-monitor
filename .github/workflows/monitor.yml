name: Public web monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '障害Issue通知テスト（監視サイトへの通信なし）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: public-web-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test monitor with fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Check public pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure && 'true' || 'false' }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            python3 monitor.py --simulate-failure --github-issues
          else
            python3 monitor.py --github-issues
          fi
